<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FHE — leather loading cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Libre Caslon Text',Georgia,serif;background:#0d1f14}

  /* the paper page revealed underneath */
  .page{position:fixed;inset:0;background:
      radial-gradient(120% 90% at 50% 0%, #fbf8f1 0%, #f4efe4 60%, #ece5d6 100%);
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
  .page h1{font-size:34px;font-weight:700;color:#16281c;letter-spacing:.01em}
  .page p{font-family:Helvetica,Arial,sans-serif;font-size:13px;color:#6d7a6c;letter-spacing:.08em;text-transform:uppercase}

  /* ============ THE LEATHER COVER ============
     Rich tan saddle leather, entirely gradient-built:
     - base tonal variation (hide isn't one flat color)
     - broad sheen from the light source (upper-left)
     - fine grain via layered micro-gradients
     - burnished darker edges, as real leather wears  */
  .cover{
    position:fixed;inset:0;cursor:pointer;transform-origin:left center;
    transform-style:preserve-3d;
    background:
      /* burnished perimeter */
      radial-gradient(140% 120% at 50% 50%, rgba(0,0,0,0) 52%, rgba(38,16,4,.42) 100%),
      /* broad specular sheen, upper-left light */
      radial-gradient(80% 60% at 26% 22%, rgba(255,216,160,.30) 0%, rgba(255,200,140,.10) 32%, rgba(0,0,0,0) 68%),
      /* worn lighter patches where a cover is handled */
      radial-gradient(50% 40% at 72% 68%, rgba(214,150,88,.20) 0%, rgba(0,0,0,0) 70%),
      radial-gradient(40% 34% at 20% 76%, rgba(120,58,20,.22) 0%, rgba(0,0,0,0) 72%),
      /* fine grain — layered micro gradients, no image */
      repeating-linear-gradient(112deg, rgba(255,255,255,.020) 0 2px, rgba(0,0,0,.024) 2px 4px),
      repeating-linear-gradient(38deg,  rgba(255,255,255,.014) 0 3px, rgba(0,0,0,.018) 3px 5px),
      repeating-linear-gradient(74deg,  rgba(90,40,10,.05) 0 7px, rgba(0,0,0,0) 7px 15px),
      /* the hide itself */
      linear-gradient(152deg, #a4632c 0%, #8d4f22 34%, #7b421c 62%, #653316 100%);
    box-shadow:inset 0 0 120px rgba(40,16,4,.55), inset 0 2px 0 rgba(255,214,168,.18);
    transition:transform 1.15s cubic-bezier(.62,.02,.28,1), opacity 1.15s ease;
  }
  /* the opening: bottom-right leads, top-right follows, surface curves */
  .cover.open{
    transform:perspective(1600px) rotateY(-104deg) rotateZ(-7deg) translateX(-4%);
    opacity:.02;
  }
  /* a slight vertical bow so the leather reads as bending, not as a flat plane */
  .cover::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,
      rgba(0,0,0,.30) 0%, rgba(0,0,0,.06) 12%,
      rgba(255,225,180,.05) 46%, rgba(0,0,0,.10) 78%, rgba(0,0,0,.34) 100%);
  }
  /* stitched edge, a few px in from the spine side */
  .stitch{
    position:absolute;top:26px;bottom:26px;left:30px;width:0;
    border-left:2px dashed rgba(255,220,175,.30);
    filter:drop-shadow(0 1px 0 rgba(60,26,6,.6));
  }

  /* ============ BLIND-STAMPED WORDMARK ============
     No color. The letterforms are transparent; a dark inner recess and a
     light lower lip do all the work — light source upper-left, and the
     whole thing shifts as the cursor moves across the hide. */
  .stampwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
  .stamp{
    color:transparent;font-weight:700;font-size:clamp(28px,6.2vw,74px);letter-spacing:.045em;text-align:center;line-height:1.15;
    background:linear-gradient(var(--ang,158deg),
      rgba(0,0,0,.60) 0%, rgba(0,0,0,.34) 26%, rgba(0,0,0,.06) 46%,
      rgba(255,226,186,.16) 62%, rgba(255,232,196,.34) 100%);
    -webkit-background-clip:text;background-clip:text;
    filter:
      drop-shadow(calc(var(--dx,1px) * -1) calc(var(--dy,1px) * -1) 0.5px rgba(46,20,5,.85))
      drop-shadow(var(--dx,1px) var(--dy,1px) 0.5px rgba(255,222,178,.34));
  }
  .rule{width:min(58%,520px);height:1px;background:linear-gradient(90deg,
      rgba(0,0,0,0), rgba(46,20,5,.55) 18%, rgba(46,20,5,.55) 82%, rgba(0,0,0,0));
    box-shadow:0 1px 0 rgba(255,222,178,.22)}
  .est{color:transparent;font-family:Helvetica,Arial,sans-serif;font-size:12px;letter-spacing:.42em;font-weight:600;
    background:linear-gradient(158deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.2) 50%, rgba(255,226,186,.3) 100%);
    -webkit-background-clip:text;background-clip:text;
    filter:drop-shadow(-.5px -.5px 0 rgba(46,20,5,.8)) drop-shadow(.5px .5px 0 rgba(255,222,178,.3))}
  .hint{position:fixed;bottom:26px;left:0;right:0;text-align:center;z-index:5;
    font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:.2em;color:rgba(255,225,185,.5);text-transform:uppercase}
  .cover.open ~ .hint{opacity:0;transition:opacity .3s}
</style>
</head>
<body>

<div class="page">
  <h1>Good morning, CJ</h1>
  <p>Today · Lesson with Claire · 3:00pm</p>
</div>

<div class="cover" id="cover">
  <div class="stitch"></div>
  <div class="stampwrap">
    <div class="stamp" id="stamp">French Heritage<br>Equestrian</div>
    <div class="rule"></div>
    <div class="est">SAN DIEGO · CALIFORNIA</div>
  </div>
</div>
<div class="hint">Move the cursor · click to open</div>

<script>
  const cover = document.getElementById('cover');
  const stamp = document.getElementById('stamp');
  // cursor moves the light across the hide: the stamp's recess and lip shift with it
  addEventListener('mousemove', e => {
    const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
    const ang = 158 + x * 40 - y * 20;
    stamp.style.setProperty('--ang', ang + 'deg');
    stamp.style.setProperty('--dx', (1 + x * 1.6).toFixed(2) + 'px');
    stamp.style.setProperty('--dy', (1 + y * 1.6).toFixed(2) + 'px');
  });
  cover.addEventListener('click', () => cover.classList.add('open'));
</script>
</body>
</html>
