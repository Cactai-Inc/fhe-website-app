<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- UIO-005: iOS home-screen bookmarks don't take SVG, and a transparent
         PNG would composite onto iOS's own background (black), so this is a
         separate rendered PNG with the ground filled, not a fallback of the
         favicon. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover: without it iOS letterboxes the page inside the safe
         area in landscape, leaving pale bands beside the cardstock header where
         the notch and home indicator live. With it the page owns the full width
         and the CONTENT is inset instead, via env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Fallback title/description; per-page <head> is injected by react-helmet-async
         (prerendered into static HTML at build time, set on the client at runtime). -->
    <title>French Heritage Equestrian — Jumper Lessons & Training | Coastal San Diego</title>
    <meta name="description" content="A family-run jumper program and community at Carmel Creek Ranch in coastal San Diego — riding lessons, horse care, and acquisition support, rooted in classical European training." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
